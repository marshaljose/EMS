name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'employee-management-app/backend/**'

  push:
    branches:
      - main
    paths:
      - 'employee-management-app/backend/**'

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: employee-management-app/backend

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: employee-management-app/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test --if-present -- --passWithNoTests

      - name: Check code quality
        run: npm run lint --if-present